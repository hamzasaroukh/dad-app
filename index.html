    @keyframes fadeIn {

// ─── PIN ──────────────────────────────────────────────────────────────────────
const CORRECT_PIN = '0000'
let pinValue = ''
let pinError = false

function renderPin() {
  const dots = Array.from({ length: 4 }, (_, i) => {
    const filled = i < pinValue.length
    const color = pinError ? '#ef4444' : (filled ? '#4338ca' : 'transparent')
    const border = pinError ? '#ef4444' : '#4338ca'
    return `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid ${border};transition:background 0.15s"></div>`
  }).join('')

  document.getElementById('pin-screen').innerHTML = `
    <div style="min-height:100dvh;background:#eef2ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px">
      <div style="text-align:center">

        <div style="font-size:14px;color:#6b7280;margin-top:4px">أدخل الرمز السري</div>
      </div>
      <div style="display:flex;gap:18px" id="pin-dots">${dots}</div>
      ${pinError ? `<div style="color:#ef4444;font-size:13px;margin-top:-16px">رمز خاطئ</div>` : ''}
      <div style="display:grid;grid-template-columns:repeat(3,72px);gap:12px">
        ${['1','2','3','4','5','6','7','8','9'].map(d => `<button class="pin-btn" onclick="pinPress('${d}')">${d}</button>`).join('')}

        <button class="pin-btn" onclick="pinPress('0')">0</button>
        <button class="pin-btn" onclick="pinBack()" style="background:transparent;border:none;color:#4338ca;font-size:20px;box-shadow:none">⌫</button>
      </div>
    </div>
  `
}

function pinPress(digit) {
  if (pinValue.length >= 4) return
  pinValue += digit
  pinError = false
  renderPin()

  if (pinValue.length === 4) {
    if (pinValue === CORRECT_PIN) {
      sessionStorage.setItem('unlocked', 'true')
      document.getElementById('pin-screen').style.display = 'none'
      document.getElementById('app').style.display = 'block'
      init()
    } else {
      pinError = true
      document.getElementById('pin-dots').classList.add('shake')
      setTimeout(() => { pinValue = ''; pinError = false; renderPin() }, 700)
    }
  }
}

function pinBack() {
  pinValue = pinValue.slice(0, -1)
  pinError = false
  renderPin()
}

// Check if already unlocked this session

  document.getElementById('app').style.display = 'block'

} else {

}

// ─── STATE ────────────────────────────────────────────────────────────────────
const now = new Date()
const S = {
  lang:       localStorage.getItem('lang') || 'fr',
  year:       now.getFullYear(),
  month:      now.getMonth() + 1,
  expenses:   [],
  loading:    false,
  showAdd:    false,
  showReport: false,
  deleteId:   null,
  editingId:  null,
}

// ─── DATABASE ─────────────────────────────────────────────────────────────────
async function fetchExpenses(year, month) {
  const start = `${year}-${String(month).padStart(2,'0')}-01`
  const last  = new Date(year, month, 0).getDate()
  const end   = `${year}-${String(month).padStart(2,'0')}-${String(last).padStart(2,'0')}`
  const { data, error } = await db.from('expenses').select('*')
    .gte('date', start).lte('date', end)
    .order('date', { ascending: false })
    .order('created_at', { ascending: false })
  if (error) throw error
  return data || []
}

async function insertExpense(date, desc, price) {
  const { error } = await db.from('expenses').insert({ date, description: desc, price: parseFloat(price) })
  if (error) throw error
}

async function deleteExpense(id) {
  const { error } = await db.from('expenses').delete().eq('id', id)
  if (error) throw error
}

async function editExpense(id, date, desc, price) {
  const { error } = await db.from('expenses').update({ date, description: desc, price: parseFloat(price) }).eq('id', id)
  if (error) throw error
}

// ─── LOAD + RENDER ────────────────────────────────────────────────────────────
async function reload() {
  S.loading = true
  render()
  try {
    S.expenses = await fetchExpenses(S.year, S.month)
  } catch(e) {
    console.error(e)
  }
  S.loading = false
  render()
}

function groupByDay(list) {
  const m = {}
  list.forEach(e => { if(!m[e.date]) m[e.date]=[]; m[e.date].push(e) })
  return Object.entries(m)
    .map(([date,exps]) => ({ date, expenses:exps, total:exps.reduce((s,e)=>s+Number(e.price),0) }))
    .sort((a,b) => b.date.localeCompare(a.date))
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function fmtDate(str, tr) {
  const d = new Date(str + 'T00:00:00')
  return `${tr.days[d.getDay()]} ${d.getDate()} ${tr.months[d.getMonth()]}`
}

        ? `<div style="text-align:center;padding:80px 0;color:#94a3b8;font-size:18px">${tr.loading}</div>`

               <div style="font-size:64px;margin-bottom:16px">🛒</div>
               <p style="font-size:18px;line-height:1.7">${tr.noExpenses}</p>

}

        </h2>
        <div style="display:flex;flex-direction:column;gap:18px">

            <div style="display:flex;gap:8px;align-items:center">
              <input class="field-input" type="number" id="m-day" min="1" max="31" placeholder="JJ" value="${eDay}"

              <select id="m-month" class="field-input" style="flex:1;cursor:pointer;padding-right:4px">
                ${tr.months.map((m,i)=>`<option value="${i+1}" ${i+1===eMonth?'selected':''}>${m}</option>`).join('')}
              </select>
              <input class="field-input" type="number" id="m-year" min="2020" max="2099" placeholder="AAAA" value="${eYear}"
                style="width:84px;text-align:center;padding-left:8px;padding-right:8px" />
            </div>
          </div>
          <div>
            <label style="display:block;font-size:17px;font-weight:700;color:#475569;margin-bottom:8px">${tr.whatBought}</label>
            <input class="field-input" type="text" id="m-desc" placeholder="${tr.descHint}"
              value="${editing ? esc(editing.description) : ''}"
              onkeydown="if(event.key==='Enter')handleSave()" />
          </div>
          <div>
            <label style="display:block;font-size:17px;font-weight:700;color:#475569;margin-bottom:8px">${tr.price} (${tr.currency})</label>
            <input class="field-input" type="number" id="m-price" inputmode="decimal" placeholder="0.00" min="0" step="0.01"
              value="${editing ? editing.price : ''}"
              onkeydown="if(event.key==='Enter')handleSave()" />
          </div>
        </div>
        <div style="display:flex;gap:12px;margin-top:28px">
          <button class="btn-cancel" onclick="closeAdd()">${tr.cancel}</button>
          <button class="btn-save" id="save-btn" onclick="handleSave()">${tr.save}</button>
        </div>
      </div>
    </div>
  `
}

function deleteConfirmModal(tr, dir) {
  return `
    <div class="modal-overlay fade-in" dir="${dir}" style="align-items:center;padding:24px">
      <div class="slide-up" style="background:white;border-radius:24px;padding:32px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25)">
        <div style="font-size:52px;margin-bottom:14px">🗑️</div>
        <h3 style="font-size:21px;font-weight:800;color:#1e293b;margin:0 0 10px">${tr.deleteTitle}</h3>
        <p style="font-size:16px;color:#64748b;margin:0 0 28px;line-height:1.5">${tr.deleteMsg}</p>
        <div style="display:flex;gap:12px">
          <button class="btn-cancel" onclick="cancelDelete()">${tr.no}</button>
          <button class="btn-delete-confirm" onclick="doDelete()">${tr.yes}</button>
        </div>
      </div>
    </div>
  `
}

function reportModal(groups, grandTotal, tr, dir) {
  const cards = groups.map(g => {
    const rows = g.expenses.map(e => `
      <div style="display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid #f8fafc">
        <span style="color:#475569;font-size:14px">${esc(e.description)}</span>
        <span style="font-weight:600;color:#1e293b;font-size:14px">${Number(e.price).toFixed(2)} ${tr.currency}</span>
      </div>`).join('')
    return `
      <div style="border:1px solid #f1f5f9;border-radius:14px;overflow:hidden">
        <div style="background:#eef2ff;padding:8px 12px;font-weight:700;color:#4338ca;font-size:14px">${g.date}</div>
        ${rows}
        <div style="background:#f8fafc;padding:8px 12px;display:flex;justify-content:space-between;border-top:1px solid #f1f5f9">
          <span style="font-weight:600;color:#94a3b8;font-size:13px">${tr.dailyTotal}</span>
          <span style="font-weight:700;color:#16a34a;font-size:14px">${g.total.toFixed(2)} ${tr.currency}</span>
        </div>
      </div>`
  }).join('')

  return `
    <div class="modal-overlay fade-in" dir="${dir}" onclick="overlayClose(event,'closeReport')" style="align-items:center;padding:16px">
      <div class="slide-up" style="background:white;width:100%;max-width:512px;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;max-height:88vh">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #f1f5f9">
          <h2 style="font-size:17px;font-weight:800;color:#1e293b;margin:0">${tr.reportBtn} — ${TR[S.lang].months[S.month-1]} ${S.year}</h2>
          <button onclick="closeReport()" style="width:36px;height:36px;border-radius:50%;border:none;background:none;font-size:20px;color:#94a3b8;cursor:pointer">✕</button>
        </div>
        <div style="overflow-y:auto;flex:1;padding:16px;display:flex;flex-direction:column;gap:10px">
          ${groups.length===0 ? '<p style="text-align:center;color:#94a3b8;padding:40px 0;font-size:18px">🛒</p>' : cards}
        </div>
        <div style="padding:16px;border-top:1px solid #f1f5f9">
          <div style="background:#4f46e5;color:white;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="font-size:17px;font-weight:700">${tr.monthlyTotal}</span>
            <span style="font-size:24px;font-weight:800">${grandTotal.toFixed(2)} ${tr.currency}</span>
          </div>
          <button class="print-btn" onclick="handlePrint()">🖨️ ${tr.print}</button>
        </div>
      </div>
    </div>
  `
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function toggleLang()  { S.lang = S.lang==='fr'?'ar':'fr'; localStorage.setItem('lang',S.lang); render() }
function prevMonth()   { S.month===1 ? (S.month=12,S.year--) : S.month--; reload() }
function nextMonth()   { S.month===12 ? (S.month=1,S.year++) : S.month++; reload() }
function openAdd()     { S.editingId=null; S.showAdd=true; render() }
function closeAdd()    { S.showAdd=false; S.editingId=null; render() }
function openReport()  { S.showReport=true; render() }
function closeReport() { S.showReport=false; render() }
function overlayClose(e, fn) { if(e.target===e.currentTarget) window[fn]() }
function confirmDelete(id) { S.deleteId=id; render() }
function cancelDelete()    { S.deleteId=null; render() }
function openEdit(id)      { S.editingId=id; S.showAdd=true; render() }

async function doDelete() {
  const id = S.deleteId
  S.deleteId = null
  await deleteExpense(id)
  await reload()
}

async function handleSave() {
  const day   = parseInt(document.getElementById('m-day').value)
  const month = parseInt(document.getElementById('m-month').value)
  const year  = parseInt(document.getElementById('m-year').value)
  const desc  = document.getElementById('m-desc').value.trim()
  const price = document.getElementById('m-price').value

  const dayEl   = document.getElementById('m-day')
  const descEl  = document.getElementById('m-desc')
  const priceEl = document.getElementById('m-price')

  let ok = true
  if (!day||day<1||day>31||!year||year<2020) { dayEl.style.borderColor='#ef4444'; ok=false } else dayEl.style.borderColor='#e2e8f0'
  if (!desc)                                  { descEl.style.borderColor='#ef4444'; ok=false } else descEl.style.borderColor='#e2e8f0'
  if (!price||parseFloat(price)<=0)           { priceEl.style.borderColor='#ef4444'; ok=false } else priceEl.style.borderColor='#e2e8f0'
  if (!ok) return

  const btn = document.getElementById('save-btn')
  if (btn) btn.disabled = true

  const date = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`
  try {
    if (S.editingId) {
      await editExpense(S.editingId, date, desc, price)
      S.editingId = null
    } else {
      await insertExpense(date, desc, price)
    }
    S.showAdd = false
    await reload()
  } catch(e) {
    console.error(e)
    if (btn) btn.disabled = false
  }
}

function handlePrint() {
  const tr     = TR[S.lang]
  const dir    = S.lang==='ar'?'rtl':'ltr'
  const groups = groupByDay(S.expenses)
  const total  = S.expenses.reduce((s,e)=>s+Number(e.price), 0)

  const rows = groups.map(g =>
    g.expenses.map(e =>
      `<tr><td>${g.date}</td><td>${esc(e.description)}</td><td class="amt">${Number(e.price).toFixed(2)} ${tr.currency}</td></tr>`
    ).join('') +
    `<tr class="sub"><td colspan="2">${tr.dailyTotal}</td><td class="amt">${g.total.toFixed(2)} ${tr.currency}</td></tr>`
  ).join('')

  const html = `<!DOCTYPE html>
<html lang="${S.lang}" dir="${dir}">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @page{margin:0}
  body{font-family:'Cairo',sans-serif;margin:15mm 20mm;direction:${dir};color:#1e293b}
  h1{font-size:26px;text-align:center;color:#1e1b4b;margin:0 0 4px}
  h2{font-size:15px;text-align:center;color:#6b7280;margin:0 0 24px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:#4338ca;color:white;padding:10px 12px;text-align:start}
  td{padding:9px 12px;border-bottom:1px solid #e2e8f0}
  tr:nth-child(even){background:#f8fafc}
  .sub{background:#eef2ff!important;font-weight:700;color:#4338ca}
  tfoot tr{background:#4338ca!important;color:white;font-size:16px;font-weight:700}
  tfoot td{padding:13px 12px}
  .amt{text-align:end}
</style></head>
<body>
<h1>الحسين النجاري</h1>
<h2>${tr.reportTitle} — ${tr.months[S.month-1]} ${S.year}</h2>
<table>
  <thead><tr><th>${tr.dateCol}</th><th>${tr.itemCol}</th><th class="amt">${tr.amountCol}</th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td colspan="2">${tr.monthlyTotal}</td><td class="amt">${total.toFixed(2)} ${tr.currency}</td></tr></tfoot>
</table>
</body></html>`

  const w = window.open('','_blank')
  if(w){ w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(),700) }
}

document.addEventListener('keydown', e => {
  if(e.key==='Escape') {
    if(S.deleteId)        cancelDelete()
    else if(S.showAdd)    closeAdd()
    else if(S.showReport) closeReport()
  }
})

// ─── START ────────────────────────────────────────────────────────────────────
async function init() {
  render()
  await reload()
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {})
  })
}
</script>
</body>
</html>
